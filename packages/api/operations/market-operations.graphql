query OwnMarketOperations(
  $section: MarketOperationsSection!
  $occurrenceId: Int
  $input: JSON
) {
  ownMarketOperations(
    section: $section
    occurrenceId: $occurrenceId
    input: $input
  )
}
mutation MarketOperationsCommand($input: MarketOperationsCommand!) {
  marketOperationsCommand(input: $input)
}
query OwnVendorBoothAssignments {
  ownVendorBoothAssignments
}
query OwnVendorLinkRequests {
  ownVendorLinkRequests
}
mutation VendorRequestMarketRelationship(
  $marketId: ID!
  $expectedVersion: Int
) {
  requestOwnMarketMembership(
    marketId: $marketId
    expectedVersion: $expectedVersion
  ) {
    id
    version
    status
  }
}
mutation RespondToVendorLink(
  $id: Int!
  $expectedRevision: Int!
  $confirm: Boolean!
) {
  respondToVendorLink(
    id: $id
    expectedRevision: $expectedRevision
    confirm: $confirm
  )
}
query OwnPlatformAccountContexts {
  ownPlatformAccountContexts
}
query PlatformRoleOnboardingReviewQueue {
  platformRoleOnboardingReviewQueue
}
mutation ReviewPlatformRoleOnboarding(
  $id: ID!
  $revision: Int!
  $decision: String!
  $slug: String!
  $note: String!
) {
  reviewPlatformRoleOnboarding(
    id: $id
    revision: $revision
    decision: $decision
    slug: $slug
    note: $note
  )
}
mutation ExchangePlatformAdminHandoff($code: String!, $correlation: String!) {
  exchangePlatformAdminHandoff(code: $code, correlation: $correlation)
}

query ApplicantApplications($input: JSON) {
  applicantApplications(input: $input)
}
mutation ApplicantApplicationCommand($action: String!, $input: JSON!) {
  applicantApplicationCommand(action: $action, input: $input)
}

query MarketAttendance($input: JSON) {
  ownMarketAttendance(input: $input)
}
query VendorMarketDayAttendance($input: JSON) {
  ownVendorAttendance(input: $input)
}
mutation AttendanceCommand($input: JSON!) {
  marketAttendanceCommand(input: $input)
}

mutation VendorSelfCheckIn($occurrenceId: Int!, $expectedRevision: Int!) {
  vendorSelfCheckIn(
    occurrenceId: $occurrenceId
    expectedRevision: $expectedRevision
  )
}

mutation PlatformSignOut($everywhere: Boolean) {
  platformSignOut(everywhere: $everywhere)
}
